<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120" role="img" aria-label="Wrap">
  <title>Wrap</title>
  <!-- Loops every 4.5 s: the ring draws itself, the dot pops into the gap, the name slides in,
       it holds, then fades out and starts again. -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.92;1" dur="4.5s" repeatCount="indefinite"/>
    <g transform="translate(8 12)">
      <path d="M71.68 14.62 A41.5 41.5 0 1 1 28.32 14.62" fill="none" stroke="#F4F2EC" stroke-width="17"
            stroke-linecap="round" stroke-dasharray="216" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="216;0;0" keyTimes="0;0.2;1" calcMode="spline"
                 keySplines="0.4 0 0.2 1;0 0 1 1" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <circle cx="50" cy="8.5" r="10.5" fill="#6EE7A8">
        <animate attributeName="r" values="0;0;14;10.5;10.5" keyTimes="0;0.16;0.22;0.27;1" dur="4.5s"
                 repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="128" y="88" fill="#F4F2EC" opacity="1" letter-spacing="-1"
          font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="74" font-weight="600">wrap
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.32;1" dur="4.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-14 0;-14 0;0 0;0 0"
                        keyTimes="0;0.22;0.32;1" dur="4.5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
