# Xcode project for the iOS app, generated with XcodeGen (`brew install xcodegen`, then
# `xcodegen` in this folder). The .xcodeproj itself isn't committed.
name: Wrap
options:
  bundleIdPrefix: com.abaan
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  Wrap:
    type: application
    platform: iOS
    sources:
      - Wrap
    info:
      path: Wrap/Info.plist
      properties:
        CFBundleDisplayName: Wrap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Compose renders at the screen's full refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abaan.wrap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../sharedUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, WrapUi, -lsqlite3]
        # The shared code is built for Apple-silicon simulators only (iosSimulatorArm64).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # The Gradle step below writes outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :sharedUi:embedAndSignAppleFrameworkForXcode
