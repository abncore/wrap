name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Shared tests (JVM)
        run: ./gradlew :shared:allTests
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # The shared module's Android target needs an SDK even on macOS.
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Build the iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkDebugFrameworkIosArm64
